services:
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    image: "react-frontend_1"
    container_name: "react-frontend_1"
    volumes:
      - ./config/node/frontend_1/src:/app/src
    ports:
      - 3000:3000
    environment:
      - CHOKEDIR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_APP_NAME=myapp
